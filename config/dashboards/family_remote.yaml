# Family Remote — super-simple big-tile Lovelace dashboard for the iPads.
# Built with Mushroom + Bubble Card + the Xiaomi/Dreame vacuum-map card (all via HACS).
# Entity IDs are placeholders — finalize in the build phase. See docs/family-remote.md.

title: Family Remote
views:
  - title: Home
    icon: mdi:home
    type: sections
    sections:
      # --- Lights -------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Lights
          - type: custom:mushroom-light-card
            entity: light.living_room
            name: Living Room
            icon: mdi:sofa
            layout: vertical
          - type: custom:mushroom-light-card
            entity: light.kitchen
            name: Kitchen
            icon: mdi:countertop
            layout: vertical
          - type: custom:mushroom-light-card
            entity: light.bedroom
            name: Bedroom
            icon: mdi:bed
            layout: vertical
          # Big, obvious "All Off"
          - type: custom:mushroom-template-card
            primary: All Off
            icon: mdi:power
            icon_color: red
            tap_action:
              action: call-service
              service: light.turn_off
              target:
                entity_id: all

      # --- Garage + Scenes ---------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Garage & Scenes
          - type: custom:mushroom-cover-card
            entity: cover.garage_door
            name: Garage
            icon: mdi:garage
            show_buttons_control: true
          - type: custom:mushroom-template-card
            primary: Movie Night
            icon: mdi:movie-open
            icon_color: indigo
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.movie_night
          - type: custom:mushroom-template-card
            primary: Good Night
            icon: mdi:weather-night
            icon_color: deep-purple
            tap_action:
              action: call-service
              service: script.goodnight

      # --- Media --------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: TV & Speakers
          - type: custom:mushroom-media-player-card
            entity: media_player.living_room_tv
            name: Living Room
            use_media_info: true
            volume_controls:
              - volume_buttons
              - volume_set
            media_controls:
              - play_pause_stop

      # --- Dreame tap-a-room map ---------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Vacuum
          # Tap rooms on the real map, flip Clean/Mop, press Start. No setup surfaced.
          - type: custom:xiaomi-vacuum-map-card
            entity: vacuum.dreame
            map_source:
              camera: camera.dreame_map
            calibration_source:
              camera: true
            # Room selection mode = tap rooms to clean
            internal_variables: {}
            modes:
              - name: Rooms
                run_immediately: false
                selection_type: ROOM
                # service_call_schema filled in during build for the dreame integration
