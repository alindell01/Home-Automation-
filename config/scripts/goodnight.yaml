# Reusable "Good Night" script — callable from a tile, a voice command, or the night routine.
# Keyed by script name (merged via !include_dir_merge_named scripts/). Placeholders.

goodnight:
  alias: "Good Night"
  icon: mdi:weather-night
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.good_night
    - service: lock.lock
      target:
        entity_id: lock.front_door
    - if:
        - condition: state
          entity_id: cover.garage_door
          state: "open"
      then:
        - service: !secret mobile_notify_target
          data:
            title: "🚗 Garage still open"
            message: "Good Night ran but the garage is still open."
    - service: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.alarmo
